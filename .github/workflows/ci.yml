name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.1.5"

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/Gbex.FrontDesk.Agent.Windows/Gbex.FrontDesk.Agent.Windows.csproj --runtime win-x86

      - name: Build
        run: >
          dotnet build src/Gbex.FrontDesk.Agent.Windows/Gbex.FrontDesk.Agent.Windows.csproj
          --configuration Release
          --runtime win-x86
          --no-restore
          -p:Version=${{ env.APP_VERSION }}
          -p:PlatformTarget=x86

      - name: Publish self-contained win-x86
        run: >
          dotnet publish src/Gbex.FrontDesk.Agent.Windows/Gbex.FrontDesk.Agent.Windows.csproj
          --configuration Release
          --runtime win-x86
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ env.APP_VERSION }}
          -p:PlatformTarget=x86
          --output publish/GbexFrontDeskAgent

      - name: Verify bundled Wacom COM activation without SDK installation
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$pwd/publish/GbexFrontDeskAgent/GbexFrontDeskAgent.exe" -ArgumentList "--wacom-sdk-self-test" -PassThru -RedirectStandardOutput wacom-sdk.out -RedirectStandardError wacom-sdk.err
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Wacom SDK activation timed out"
          }
          $process.Refresh()
          Get-Content wacom-sdk.out, wacom-sdk.err
          if ($process.ExitCode -ne 0) { throw "Bundled Wacom SDK failed to activate: $($process.ExitCode)" }
          if (-not (Select-String -Path wacom-sdk.out -Pattern "WACOM_SDK_OK" -Quiet)) { throw "Wacom SDK self-test did not complete" }

      - name: Verify synthetic pen capture and upload receipt checks
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$pwd/publish/GbexFrontDeskAgent/GbexFrontDeskAgent.exe" -ArgumentList "--wacom-capture-self-test" -PassThru -RedirectStandardOutput wacom-capture.out -RedirectStandardError wacom-capture.err
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Wacom capture checks timed out"
          }
          $process.Refresh()
          Get-Content wacom-capture.out, wacom-capture.err
          if ($process.ExitCode -ne 0) { throw "Wacom capture checks failed: $($process.ExitCode)" }
          if (-not (Select-String -Path wacom-capture.out -Pattern "WACOM_CAPTURE_CHECKS_OK" -Quiet)) { throw "Wacom capture checks did not complete" }

      - name: Package customer zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path publish\GbexFrontDeskAgent\* -DestinationPath release\GbexFrontDeskAgent-win-x86.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ env.APP_VERSION }} installer\setup.iss
          Copy-Item installer-output\GbexFrontDeskAgentSetup.exe release\GbexFrontDeskAgentSetup.exe -Force

      - name: Upload raw publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: GbexFrontDeskAgent-win-x86
          path: publish/GbexFrontDeskAgent/**
          if-no-files-found: error

      - name: Upload customer zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: GbexFrontDeskAgent-win-x86-zip
          path: release/GbexFrontDeskAgent-win-x86.zip
          if-no-files-found: error

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: GbexFrontDeskAgentSetup
          path: release/GbexFrontDeskAgentSetup.exe
          if-no-files-found: error

      - name: Publish customer download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $zipAsset = "release/GbexFrontDeskAgent-win-x86.zip"
          $setupAsset = "release/GbexFrontDeskAgentSetup.exe"
          $notes = @"
          GBEX Front Desk Agent $env:APP_VERSION

          - Native Windows app for GBEX front desk.
          - Opens the live /admin/front-desk panel with persistent WebView2 login.
          - Receives active sale commands from the web workflow for ID scan and Wacom signature capture.
          - Uploads ID/signature files only to the active customer capture session.
          - Removes normal operator file-picking buttons to prevent mixing customer documents.
          - Watches only the secure GBEX scan folder for SMB scan-to-folder devices.
          - Prepares the local GBEX scan folder/share and firewall rules when possible.
          - Captures Wacom STU-430 signatures through the native Wacom STU SDK/COM path, not SigCaptX/WebView.
          - Publishes as win-x86 to match the common Wacom STU COM runtime used by the official C# samples.
          - Blocks signature completion instead of opening a mouse/touch fallback when native Wacom capture fails.
          - Retries briefly busy USB connections following Wacom DemoButtons guidance.
          - Verifies the saved signature record matches the active account and capture session before reporting success.
          - Tests pen/button processing and PNG output with synthetic data on Windows. Physical STU-430 capture still requires an on-device acceptance test.
          - Recommended customer install: download GbexFrontDeskAgentSetup.exe and run it.
          - If the app fails on the customer PC, check %LOCALAPPDATA%\GBEX\FrontDeskAgent\front-desk-agent.log.
          "@

          if (gh release view $tag 2>$null) {
            gh release upload $tag $zipAsset $setupAsset --clobber
            gh release edit $tag --notes $notes --title "GBEX Front Desk Agent $env:APP_VERSION"
          } else {
            gh release create $tag $zipAsset $setupAsset --target $env:GITHUB_SHA --title "GBEX Front Desk Agent $env:APP_VERSION" --notes $notes
          }
