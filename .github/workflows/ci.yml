name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.0.5"

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Gbex.FrontDesk.Agent.Windows.sln

      - name: Build
        run: dotnet build Gbex.FrontDesk.Agent.Windows.sln --configuration Release --no-restore -p:Version=${{ env.APP_VERSION }}

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/Gbex.FrontDesk.Agent.Windows/Gbex.FrontDesk.Agent.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ env.APP_VERSION }}
          --output publish/GbexFrontDeskAgent

      - name: Package customer zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path publish\GbexFrontDeskAgent\* -DestinationPath release\GbexFrontDeskAgent-win-x64.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ env.APP_VERSION }} installer\setup.iss
          Copy-Item installer-output\GbexFrontDeskAgentSetup.exe release\GbexFrontDeskAgentSetup.exe -Force

      - name: Upload raw publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: GbexFrontDeskAgent-win-x64
          path: publish/GbexFrontDeskAgent/**
          if-no-files-found: error

      - name: Upload customer zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: GbexFrontDeskAgent-win-x64-zip
          path: release/GbexFrontDeskAgent-win-x64.zip
          if-no-files-found: error

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: GbexFrontDeskAgentSetup
          path: release/GbexFrontDeskAgentSetup.exe
          if-no-files-found: error

      - name: Publish customer download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $zipAsset = "release/GbexFrontDeskAgent-win-x64.zip"
          $setupAsset = "release/GbexFrontDeskAgentSetup.exe"
          $notes = @"
          GBEX Front Desk Agent $env:APP_VERSION

          - Native Windows app for GBEX front desk.
          - Opens the live /admin/front-desk panel with persistent WebView2 login.
          - Detects USB scanner/Wacom devices inside the same app.
          - Supports native WIA identity scan upload to GBEX.
          - Auto-watches common scanner output folders and uploads new identity scans without per-file selection.
          - Supports Wacom STU signature capture through Wacom SigCaptX when installed.
          - Auto-submits Wacom STU signatures after signing if the device OK button is not pressed.
          - Provides an in-app signature capture fallback when Wacom STU SDK is not installed.
          - Recommended customer install: download GbexFrontDeskAgentSetup.exe and run it.
          - If the app fails on the customer PC, check %LOCALAPPDATA%\GBEX\FrontDeskAgent\front-desk-agent.log.
          "@

          if (gh release view $tag 2>$null) {
            gh release upload $tag $zipAsset $setupAsset --clobber
            gh release edit $tag --notes $notes --title "GBEX Front Desk Agent $env:APP_VERSION"
          } else {
            gh release create $tag $zipAsset $setupAsset --target $env:GITHUB_SHA --title "GBEX Front Desk Agent $env:APP_VERSION" --notes $notes
          }
