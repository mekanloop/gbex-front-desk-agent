name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.0.0"

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Gbex.FrontDesk.Agent.Windows.sln

      - name: Build
        run: dotnet build Gbex.FrontDesk.Agent.Windows.sln --configuration Release --no-restore -p:Version=${{ env.APP_VERSION }}

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/Gbex.FrontDesk.Agent.Windows/Gbex.FrontDesk.Agent.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ env.APP_VERSION }}
          --output publish/GbexFrontDeskAgent

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Upload raw publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: GbexFrontDeskAgent-win-x64
          path: publish/GbexFrontDeskAgent/**
          if-no-files-found: error

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup is not available at $iscc"
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GbexFrontDeskAgentSetup
          path: installer-output/GbexFrontDeskAgentSetup.exe
          if-no-files-found: error

      - name: Publish customer download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $asset = "installer-output/GbexFrontDeskAgentSetup.exe"
          $notes = @"
          GBEX Front Desk Agent $env:APP_VERSION

          - Native Windows app for GBEX front desk.
          - Opens the live /admin/front-desk panel with persistent WebView2 login.
          - Detects USB scanner/Wacom devices inside the same app.
          - Supports native WIA identity scan upload to GBEX.
          "@

          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset --clobber
            gh release edit $tag --notes $notes --title "GBEX Front Desk Agent $env:APP_VERSION"
          } else {
            gh release create $tag $asset --target $env:GITHUB_SHA --title "GBEX Front Desk Agent $env:APP_VERSION" --notes $notes
          }
